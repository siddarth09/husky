controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    effort_controller:
      type: effort_controllers/JointGroupEffortController
      joints:
        - RF_HAA
        - RF_HFE
        - RF_KFE
        - LF_HAA
        - LF_HFE
        - LF_KFE
        - RH_HAA
        - RH_HFE
        - RH_KFE
        - LH_HAA
        - LH_HFE
        - LH_KFE
      command_interfaces:
        - effort
      state_interfaces:
        -position
        -velocity